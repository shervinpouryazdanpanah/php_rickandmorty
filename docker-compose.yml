services:
  mysql:
    image: mysql:8.0
    container_name: graphql_mysql
    environment:
      MYSQL_DATABASE: countries
      MYSQL_USER: username
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - ./mysql_data:/var/lib/mysql

  php:
    build: .
    container_name: graphql_php
    depends_on:
      - mysql
    volumes:
      - .:/app
    working_dir: /app
    command: php index.php
  phpmyadmin:
    depends_on:
      - mysql
    image: phpmyadmin:latest
    restart: always
    ports:
      - 80:80
    environment:
      - PMA_HOST=mysql
      - UPLOAD_LIMIT=50M

volumes:
  mysql_data:
